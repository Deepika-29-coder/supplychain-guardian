name: SupplyChain Guardian CI

"on":
push:
branches:
- main
pull_request:
branches:
- main

jobs:
test-and-security:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout source code
    uses: actions/checkout@v5

  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  - name: Install pytest
    run: |
      python -m pip install --upgrade pip
      pip install pytest

  - name: Run tests
    run: |
      PYTHONPATH=. pytest

  - name: Build Docker image
    run: |
      docker build -t supplychain-guardian:${{ github.sha }} .

  - name: Run Trivy vulnerability scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: "supplychain-guardian:${{ github.sha }}"
      format: "table"
      severity: "HIGH,CRITICAL"
      ignore-unfixed: true
```
