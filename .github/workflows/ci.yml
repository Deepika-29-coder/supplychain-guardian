name: SupplyChain Guardian CI

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
test-and-security:
runs-on: ubuntu-latest


steps:
  # 1. Checkout source code
  - name: Checkout source code
    uses: actions/checkout@v5

  # 2. Set up Python
  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  # 3. Install pytest
  - name: Install pytest
    run: |
      python -m pip install --upgrade pip
      pip install pytest

  # 4. Run unit tests
  - name: Run tests
    run: |
      PYTHONPATH=. pytest

  # 5. Build Docker image
  - name: Build Docker image
    run: |
      docker build -t supplychain-guardian:${{ github.sha }} .

  # 6. Scan Docker image with Trivy
  - name: Run Trivy vulnerability scan
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: "supplychain-guardian:${{ github.sha }}"
      format: "table"
      severity: "HIGH,CRITICAL"
      ignore-unfixed: true

