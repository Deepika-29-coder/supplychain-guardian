name: SupplyChain Guardian CI/CD

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
test-and-security:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout source code
    uses: actions/checkout@v5

  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  - name: Install pytest
    run: |
      python -m pip install --upgrade pip
      pip install pytest

  - name: Run tests
    run: |
      PYTHONPATH=. pytest

  - name: Build Docker image
    run: |
      docker build -t supplychain-guardian:${{ github.sha }} .

  - name: Install Trivy
    run: |
      sudo apt-get update
      sudo apt-get install -y wget
      wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

  - name: Scan Docker image
    run: |
      trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 0 \
        supplychain-guardian:${{ github.sha }}

  - name: Log in to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Tag Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    run: |
      docker tag supplychain-guardian:${{ github.sha }} \
        ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-guardian:${{ github.sha }}

  - name: Push Docker image to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    run: |
      docker push \
        ${{ secrets.DOCKERHUB_USERNAME }}/supplychain-guardian:${{ github.sha }}
```

