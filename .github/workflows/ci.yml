name: SupplyChain Guardian CI

on:
  workflow_dispatch:

  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v5

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 3. Install pytest
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 4. Run tests
      - name: Run tests
        run: |
          PYTHONPATH=. pytest

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t supplychain-guardian:${{ github.sha }} .

      # 6. Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # 7. Scan Docker image with Trivy
      - name: Scan Docker image
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            supplychain-guardian:${{ github.sha }}

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      # 9. Tag Docker image
      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag \
            supplychain-guardian:${{ github.sha }} \
            "$DOCKERHUB_USERNAME/supplychain-guardian:${{ github.sha }}"

      # 10. Push Docker image to Docker Hub
      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker push \
            "$DOCKERHUB_USERNAME/supplychain-guardian:${{ github.sha }}"
